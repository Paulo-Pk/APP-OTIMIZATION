name: Windows Native Build, Test & Release x64

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
      - 'feature/**'
      - feature/game-network-accelerator
  workflow_dispatch:

jobs:
  build-and-test-windows:
    name: Build, Test & Publish .NET 10 WPF (windows-latest x64)
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 1.5 Setup Bun and validate the TypeScript application
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 1.6 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 1.7 Lint and build the frontend
        run: |
          bun run lint
          bun run build

      - name: 2. Setup .NET 10 SDK (x64)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: 3. Display .NET SDK Info & Restore Solution Dependencies
        run: |
          dotnet --info
          dotnet restore PCControlUltimate.sln

      - name: 4. Audit NuGet Dependency Graph for Vulnerable Packages
        shell: pwsh
        run: |
          $vulnOutput = dotnet list PCControlUltimate.sln package --vulnerable --include-transitive | Out-String
          Write-Host $vulnOutput
          if ($vulnOutput -match "has the following vulnerable packages") {
            Write-Error "Vulnerable NuGet package detected in dependency graph."
            exit 1
          }

      - name: 5. Build Solution (Release x64)
        run: dotnet build PCControlUltimate.sln -c Release -p:Platform=x64

      - name: 6. Run xUnit Automated Security, SQLite, DI & Network Tests (Release x64)
        run: dotnet test PCControlUltimate.sln -c Release -p:Platform=x64 --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: 7. Publish Native WPF Application (Windows x64 Self-Contained)
        run: dotnet publish src/PCControlUltimate.App/PCControlUltimate.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/publish/win-x64

      - name: 8. Verify Published Executable, Native Libraries & SQLite Dependencies
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/win-x64"
          $requiredFiles = @(
            "PCControlUltimate.App.exe",
            "wwwroot/index.html",
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.Wpf.dll",
            "PCControlUltimate.App.dll",
            "PCControlUltimate.Core.dll",
            "PCControlUltimate.Infrastructure.dll",
            "PCControlUltimate.Windows.dll",
            "PCControlUltimate.Gaming.dll",
            "PCControlUltimate.Hardware.dll",
            "PCControlUltimate.Diagnostics.dll",
            "PCControlUltimate.Security.dll",
            "Microsoft.EntityFrameworkCore.Sqlite.dll",
            "Microsoft.Data.Sqlite.dll",
            "SQLitePCLRaw.core.dll"
          )
          foreach ($file in $requiredFiles) {
            $fullPath = Join-Path $publishDir $file
            if (!(Test-Path $fullPath)) {
              Write-Error "Missing required published file: $fullPath"
              exit 1
            }
          }
          Write-Host "Verified all required executables, assemblies, and SQLite dependencies in $publishDir"

      - name: 9. Package & Verify Windows x64 Release ZIP Archive
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath "artifacts/PCControlUltimate-win-x64-Release.zip" -Force
          if (!(Test-Path "artifacts/PCControlUltimate-win-x64-Release.zip")) {
            Write-Error "Release ZIP archive was not created!"
            exit 1
          }
          $zipSize = (Get-Item "artifacts/PCControlUltimate-win-x64-Release.zip").Length
          Write-Host "Verified Release ZIP size: $zipSize bytes"
          if ($zipSize -lt 1000000) {
            Write-Error "Release ZIP archive is unexpectedly small ($zipSize bytes) for a self-contained publish."
            exit 1
          }

      - name: 10. Upload Windows x64 Release Artifact & Test Results
        # Keep PR validation storage-free; publish an artifact only on an explicit manual run.
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PCControlUltimate-win-x64-Release
          path: |
            artifacts/PCControlUltimate-win-x64-Release.zip
            **/TestResults/*.trx
          if-no-files-found: error
          retention-days: 3
